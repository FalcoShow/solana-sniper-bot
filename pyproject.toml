[build-system]
# Keep build tooling bounded to avoid surprise CI/Render breaks.
requires = ["setuptools>=69,<80", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-sniper-bot"
version = "0.1.0"
description = "God-Tier Solana sniper runtime + quant-grade pipeline (Phase 0–7 LOCK-IN)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Andrew" }]
keywords = ["solana", "trading", "asyncio", "jupiter", "quant", "bot"]

# Runtime deps — bounded for stability on Render + CI.
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "SQLAlchemy>=2.0.49,<3",

  # asyncpg can be pain on Windows; keep platform marker.
  "asyncpg>=0.29,<1; platform_system != 'Windows'",

  # psycopg3 wheels cover most platforms; binary extra ok for CI/Render.
  "psycopg[binary]>=3.3.3,<4",

  "redis>=7.4.0,<8",
  "certifi>=2024.2,<2027",
  "python-dotenv>=1.2.2,<2",
  "requests>=2.33.1,<3",

  "solders>=0.20,<1",
  "solana>=0.35,<1",
]

[project.optional-dependencies]
# Dev tooling: make CI deterministic by pinning ruff exactly to the version CI expects.
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=4.1,<6",
  "pytest-xdist>=3.5,<4",

  # Deterministic formatting/linting (must match CI)
  "ruff==0.15.10",

  # Keep mypy bounded; CI can pin exactly later if desired.
  "mypy>=1.20.0,<2",

  # Types (only what we already use; keep bounded stability).
  "types-redis>=4.6.0.20241004",
  "types-python-dateutil>=2.9.0.20241206",
]

# Optional performance extras (safe no-ops on unsupported platforms).
perf = [
  "orjson>=3.11.8,<4; platform_python_implementation == 'CPython'",
  "uvloop>=0.19,<1; platform_system == 'Linux'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Keep packaging permissive but explicit; avoids accidental test/data packaging.
include = [
  "utils_pkg*",
  "scanner*",
  "sniper*",
  "daytrader*",
  "db*",
  "config*",
  "deploy_tools*",
]
exclude = ["tests*", "data*", "logs*", "tmp*", "node_modules*", "dist*", "build*"]

# =============================================================================
# Ruff (lint + formatting) — deterministic + low-noise + CI-safe
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "node_modules",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "data",
  "logs",
  "tmp",
]

[tool.ruff.lint]
# CI gate: correctness + imports + explicit bugbear rules we fixed.
select = ["E", "F", "I"]
extend-select = ["B023", "B904"]

ignore = [
  "E203", # whitespace before ':'
  "E402", # import not at top of file (common in CLIs / scripts)
  "E501", # long lines (SQL/URLs/long f-strings)
  # E741 intentionally NOT ignored (ambiguous l/I/O blocked).
]

[tool.ruff.lint.isort]
known-first-party = ["utils_pkg", "scanner", "sniper", "scripts", "daytrader", "db", "config", "deploy_tools"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Mypy — strict-enough for safety, without exploding on third-party libs
# =============================================================================
[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true

warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

# Pragmatic posture (third-party libs)
ignore_missing_imports = true

check_untyped_defs = false
disallow_untyped_defs = false

exclude = "(^|/)(tests|data|logs|tmp|build|dist|node_modules|\\.venv)/"

# =============================================================================
# Coverage (optional)
# =============================================================================
[tool.coverage.run]
branch = true
source = ["utils_pkg", "scanner", "sniper", "daytrader"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# NOTE:
# Pytest behavior is defined in pytest.ini ONLY (single source of truth).
# We intentionally do NOT duplicate [tool.pytest.ini_options] here to prevent drift.
