[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-sniper-bot"
version = "0.1.0"
description = "God-Tier Solana sniper runtime + quant-grade pipeline (Phase 0–7 LOCK-IN)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Andrew" }]
keywords = ["solana", "trading", "asyncio", "jupiter", "quant", "bot"]

# Runtime deps: keep real + lean.
# NOTE: asyncpg is Linux-friendly (Render). Windows typically uses psycopg.
dependencies = [
  "aiohttp>=3.9.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "SQLAlchemy>=2.0.0",
  "asyncpg>=0.29.0; platform_system != 'Windows'",
  "psycopg[binary]>=3.1",
  "redis>=5.0.0",
  "certifi>=2024.2.2",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "solders>=0.20.0",
  "solana>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.6.0",
  "mypy>=1.8.0",
  "types-redis>=4.6.0.20241004",
  "types-python-dateutil>=2.9.0.20241206",
]

perf = [
  "orjson>=3.10.0; platform_python_implementation == 'CPython'",
  "uvloop>=0.19.0; platform_system == 'Linux'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["utils_pkg*", "scanner*", "sniper*", "scripts*", "daytrader*", "db*", "config*"]
exclude = ["tests*", "data*", "logs*", "tmp*", "node_modules*", "dist*", "build*"]

# -------------------
# Ruff (lint + formatting)
# -------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "node_modules",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "data",
  "logs",
  "tmp",
]

[tool.ruff.lint]
# Gate only correctness + imports (no style churn).
select = ["E", "F", "I"]

ignore = [
  "E203", # whitespace before ':'
  "E402", # import not at top of file (common in CLIs / scripts)
  "E501", # long lines (SQL/URLs/long f-strings)
  "E741", # ambiguous variable name (project convention; do not block builds)
]

[tool.ruff.lint.isort]
known-first-party = ["utils_pkg", "scanner", "sniper", "scripts", "daytrader", "db", "config"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

# -------------------
# Pytest
# -------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

# -------------------
# Coverage
# -------------------
[tool.coverage.run]
branch = true
source = ["utils_pkg", "scanner", "sniper"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
