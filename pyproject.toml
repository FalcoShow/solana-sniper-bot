[build-system]
requires = ["setuptools>=69,<80", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-sniper-bot"
version = "0.1.0"
description = "God-Tier Solana sniper runtime + quant-grade pipeline (Phase 0–7 LOCK-IN)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Andrew" }]
keywords = ["solana", "trading", "asyncio", "jupiter", "quant", "bot"]

# Runtime deps — add upper bounds to reduce “surprise upgrades” on Render.
# If you want FULL reproducibility, add a constraints/lock workflow later (P0.5).
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "SQLAlchemy>=2.0,<3",
  "asyncpg>=0.29,<1; platform_system != 'Windows'",
  "psycopg[binary]>=3.1,<4",
  "redis>=5,<6",
  "certifi>=2024.2,<2027",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "solders>=0.20,<1",
  "solana>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=4.1,<6",
  "pytest-xdist>=3.5,<4",
  "ruff>=0.6,<1",
  "mypy>=1.8,<2",
  "types-redis>=4.6.0.20241004",
  "types-python-dateutil>=2.9.0.20241206",
]

perf = [
  "orjson>=3.10,<4; platform_python_implementation == 'CPython'",
  "uvloop>=0.19,<1; platform_system == 'Linux'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["utils_pkg*", "scanner*", "sniper*", "scripts*", "daytrader*", "db*", "config*"]
exclude = ["tests*", "data*", "logs*", "tmp*", "node_modules*", "dist*", "build*"]

# =============================================================================
# Ruff (lint + formatting) — deterministic + low-noise + CI-safe
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "node_modules",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "data",
  "logs",
  "tmp",
]

[tool.ruff.lint]
# CI gate: correctness + imports + the explicit bugbear rules we fixed.
select = ["E", "F", "I"]
extend-select = ["B023", "B904"]

ignore = [
  "E203", # whitespace before ':'
  "E402", # import not at top of file (common in CLIs / scripts)
  "E501", # long lines (SQL/URLs/long f-strings)
  # E741 intentionally NOT ignored: we block ambiguous l/I/O.
]

[tool.ruff.lint.isort]
known-first-party = ["utils_pkg", "scanner", "sniper", "scripts", "daytrader", "db", "config"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Mypy — incremental gate (scope limited to core code)
# =============================================================================
[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

check_untyped_defs = false
disallow_untyped_defs = false

ignore_missing_imports = true

files = [
  "utils_pkg",
  "daytrader",
  "scanner",
  "sniper",
  "scripts",
  "route_telemetry.py",
]

exclude = "(^|/)(tests|data|logs|tmp|build|dist|node_modules|\\.venv)/"

# =============================================================================
# Coverage (optional)
# =============================================================================
[tool.coverage.run]
branch = true
source = ["utils_pkg", "scanner", "sniper", "daytrader"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# NOTE:
# Pytest behavior is defined in pytest.ini ONLY (single source of truth).
# We intentionally do NOT duplicate [tool.pytest.ini_options] here to prevent drift.
