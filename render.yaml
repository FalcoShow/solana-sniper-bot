services:
  - type: web
    name: pump-health
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
    startCommand: python health.py --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.cache/ms-playwright
      - key: PUMPFUN_API_BASES
        value: https://frontend-api.pump.fun
      - key: PUMPFUN_DISABLE_PAGE_FETCH
        value: "1"
      - key: PUMPFUN_RETRY_MAX
        value: "4"
      - key: PUMPFUN_RETRY_BASE_MS
        value: "800"
      - key: PUMPFUN_BREAKER_FAILS
        value: "6"
      - key: PUMPFUN_BREAKER_COOL_MS
        value: "120000"
      - key: PUMPFUN_LOG_ERRORS_ONLY
        value: "1"

  - type: worker
    name: pump-sniper
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
    startCommand: ./run_bot.sh
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.cache/ms-playwright
      - key: PUMPFUN_API_BASES
        value: https://frontend-api.pump.fun
      - key: PUMPFUN_DISABLE_PAGE_FETCH
        value: "1"
      - key: PUMPFUN_RETRY_MAX
        value: "4"
      - key: PUMPFUN_RETRY_BASE_MS
        value: "800"
      - key: PUMPFUN_BREAKER_FAILS
        value: "6"
      - key: PUMPFUN_BREAKER_COOL_MS
        value: "120000"
      - key: PUMPFUN_LOG_ERRORS_ONLY
        value: "1"
