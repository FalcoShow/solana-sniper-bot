# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# render.yaml — God-Tier Blueprint (P0 Lock-In)
#
# Topology:
#   - 1x Key Value (sniper-redis) — private-only
#   - 1x Postgres  (sniper-db)    — private-only
#   - 1x Worker    (pump-sniper)  — bash ./start.sh
#
# Notes:
# - Secrets MUST stay at service envVars with sync:false (never in envVarGroups).
# - ai_db prefers SNIPER_DB_DSN, so we wire it explicitly from the database.
# - Worker is correct for a trading bot (no requirement to bind $PORT).

previews:
  generation: off

envVarGroups:
  - name: sniper-defaults
    envVars:
      # Python version pin (Render supports PYTHON_VERSION as fully-qualified x.y.z) :contentReference[oaicite:2]{index=2}
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Python hygiene
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHONFAULTHANDLER
        value: "1"

      # start.sh control-plane defaults (Render fail-closed)
      - key: RUN_MODE
        value: "bot"
      - key: START_STRICT
        value: "1"
      - key: START_RUN_CHECK_ENV
        value: "1"
      - key: START_PRECHECKS
        value: "1"
      - key: START_RUN_CI_SMOKE
        value: "0"

      # dotenv policy (Render should not read repo .env files)
      - key: START_NO_DOTENV
        value: "1"
      - key: START_ALLOW_SOURCE_ENV
        value: "0"
      - key: START_ENV_OVERRIDE
        value: "0"

      # DSN normalization / safety
      - key: START_NORMALIZE_DSN
        value: "1"
      - key: START_ADD_SSLMODE
        value: "1"
      - key: SKIP_DSN_REQUIRED
        value: "0"

      # crash supervisor knobs
      - key: MAIN_RESTART_ON_CRASH
        value: "1"
      - key: MAIN_MAX_RESTARTS
        value: "0"   # 0 = infinite
      - key: MAIN_RESTART_BACKOFF_S
        value: "3"
      - key: MAIN_RESTART_MAX_BACKOFF_S
        value: "30"
      - key: MAIN_RESTART_JITTER_S
        value: "2"
      - key: MAIN_NO_RESTART_EXIT_CODES
        value: "130,143"
      - key: MAIN_USE_SETSID
        value: "1"

      # logging
      - key: LOG_LEVEL
        value: "INFO"

      # dirs (match start.sh defaults)
      - key: DATA_DIR
        value: "/opt/render/data"
      - key: SECRETS_DIR
        value: "/opt/render/.secrets"

      # redis synthesis defaults (start.sh will honor REDIS_URL if provided)
      - key: REDIS_DB
        value: "0"
      - key: REDIS_TLS
        value: "0"

      # Safety: default OFF until you flip it on intentionally
      - key: CANARY_TRADE_ENABLED
        value: "0"

  - name: pumpfun-common
    envVars:
      - key: PUMPFUN_API_BASES
        value: "https://frontend-api.pump.fun"
      - key: PUMPFUN_DISABLE_PAGE_FETCH
        value: "1"
      - key: PUMPFUN_RETRY_MAX
        value: "4"
      - key: PUMPFUN_RETRY_BASE_MS
        value: "800"
      - key: PUMPFUN_BREAKER_FAILS
        value: "6"
      - key: PUMPFUN_BREAKER_COOL_MS
        value: "120000"
      - key: PUMPFUN_LOG_ERRORS_ONLY
        value: "1"

  - name: jupiter-defaults
    envVars:
      - key: JUP_BASE_URL
        value: "https://api.jup.ag"
      - key: JUP_ALT_BASE_URLS
        value: "https://api.jup.ag"
      - key: JUP_AS_LEGACY
        value: "1"
      - key: JUP_USE_SHARED_ACCOUNTS
        value: "1"
      - key: JUP_ONLY_DIRECT
        value: "0"

services:
  # Key Value (Redis®-compatible) — private-only
  - type: keyvalue
    name: sniper-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Worker — trading/orchestrator
  - type: worker
    name: pump-sniper
    runtime: python
    plan: starter
    region: oregon

    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

      # Normalize CRLF -> LF for start.sh (Windows-authored repos; Render-safe)
      python - <<'PY'
      from pathlib import Path
      p = Path("start.sh")
      if p.exists():
          p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n"))
      PY

      chmod +x start.sh || true

      # Fast shell syntax sanity (no env/secrets required)
      bash -n start.sh

      # Fast Python syntax sanity
      python -m compileall -q .

      # Playwright is optional; install browsers only if playwright exists
      python - <<'PY'
      import importlib.util, subprocess, sys
      if importlib.util.find_spec("playwright") is not None:
          subprocess.run([sys.executable, "-m", "playwright", "install", "chromium"], check=False)
      PY

    startCommand: bash ./start.sh

    disk:
      name: data
      mountPath: /opt/render/data
      sizeGB: 10

    envVars:
      # groups
      - fromGroup: sniper-defaults
      - fromGroup: pumpfun-common
      - fromGroup: jupiter-defaults

      # Redis wiring (private network)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sniper-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sniper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sniper-redis
          property: port

      # Postgres wiring — set ALL common keys + SNIPER_DB_DSN (ai_db prefers this)
      - key: SNIPER_DB_DSN
        fromDatabase:
          name: sniper-db
          property: connectionString
      - key: PG_DSN_INTERNAL
        fromDatabase:
          name: sniper-db
          property: connectionString
      - key: PG_DSN
        fromDatabase:
          name: sniper-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: sniper-db
          property: connectionString
      - key: POSTGRES_DSN
        fromDatabase:
          name: sniper-db
          property: connectionString

      # ---- secrets (set in Render UI after first deploy) ----
      - key: KEYPAIR_PATH
        sync: false
      - key: WALLET_PRIVATE_KEY
        sync: false
      - key: WALLET_JSON
        sync: false
      - key: WALLET_JSON_B64
        sync: false

      - key: JUP_PRO_KEY
        sync: false
      - key: JUP_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_TOKEN
        sync: false

      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

databases:
  - name: sniper-db
    plan: basic-1gb
    region: oregon
    ipAllowList: []
