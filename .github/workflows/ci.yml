name: CI

on:
  push:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_online_probes:
        description: "Run optional online connectivity probes (RPC/Jupiter/router). Manual-only to avoid flaky PR failures."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

  # Default posture: offline & deterministic (no flaky network PRs)
  SAFE_MODE: "1"
  DRYRUN: "1"
  NO_NETWORK: "1"
  DISABLE_NETWORK: "1"
  NO_NETWORK_POLICY: "1"
  PROBES_ENABLED: "0"

  # Preflight defaults
  PREFLIGHT: "1"
  PREFLIGHT_JSON_ONLY: "1"
  PREFLIGHT_STEP_TIMEOUT_S: "60"
  PREFLIGHT_PROFILE: "deploy"

  CHECK_ROUTER_JSON_ONLY: "1"
  CHECK_ROUTER_HARD_EXIT: "1"

  # Python runtime knobs
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: "UTC"

  # Linux ":" separator is correct on GitHub runners
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

  PYTHON_VERSION: "3.13"
  RUFF_VERSION: "0.9.2"

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Shell gates (start.sh bash + shellcheck + LF)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: CRLF guard (start.sh)
        run: |
          set -euo pipefail
          if LC_ALL=C grep -q $'\r' start.sh; then
            echo "FATAL: start.sh has CRLF line endings (must be LF for Render)." >&2
            exit 1
          fi

      - name: bash -n start.sh
        run: |
          set -euo pipefail
          bash -n start.sh

      - name: shellcheck start.sh (warnings fail)
        run: |
          set -euo pipefail
          shellcheck start.sh

  quality:
    name: Quality (ruff + format + compileall)
    runs-on: ubuntu-latest
    needs: shell
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev) + pin ruff
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

          python -m pip install "ruff==${RUFF_VERSION}"

          python -c "import sys; print('python', sys.version)"
          ruff --version

      - name: Ruff (check)
        run: |
          set -euo pipefail
          ruff check .

      - name: Ruff (format check)
        run: |
          set -euo pipefail
          ruff format --check .

      - name: Compile all (syntax / import-time issues)
        run: |
          set -euo pipefail
          python -m compileall -q -f .

  typecheck:
    name: Typecheck (mypy, config-gated)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev + mypy)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

          python -m pip install -U mypy

      - name: Run mypy only if config exists
        run: |
          set -euo pipefail

          HAS_CFG="0"
          if [ -f mypy.ini ] || [ -f setup.cfg ]; then
            HAS_CFG="1"
          fi
          if [ -f pyproject.toml ] && grep -q "^\[tool\.mypy\]" pyproject.toml; then
            HAS_CFG="1"
          fi

          if [ "$HAS_CFG" = "1" ]; then
            python -m mypy .
          else
            echo "No mypy config found. Skipping mypy."
          fi

  smoke:
    name: Smoke (no-network spine + init)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev + pytest)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

          python -m pip install -U pytest pytest-asyncio

      - name: Prepare artifacts dir
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: CI smoke (hard no-network spine imports)
        run: |
          set -euo pipefail
          python -m scripts.ci_smoke | tee artifacts/ci_smoke.txt

      - name: smoke_init (json-only, probes disabled)
        run: |
          set -euo pipefail
          python -m scripts.smoke_init --json-only | tee artifacts/smoke_init.json

      - name: Upload artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: artifacts
          if-no-files-found: ignore

  preflight:
    name: Preflight (deploy profile, deterministic)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev + pytest)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

          python -m pip install -U pytest pytest-asyncio

      - name: Prepare artifacts dir
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Run preflight (json-only, deploy profile)
        run: |
          set -euo pipefail
          python -m scripts.preflight --json-only --profile deploy --timeout 60 --total-timeout 0 | tee artifacts/preflight.json

      - name: Upload artifacts (preflight)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-artifacts
          path: artifacts
          if-no-files-found: ignore

  tests:
    name: Tests (pytest, no network)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev + pytest)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

          python -m pip install -U pytest pytest-asyncio pytest-xdist

      - name: Prepare artifacts dir
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Pytest (no integration / no network)
        run: |
          set -euo pipefail
          python -m pytest -q -m "not integration and not network" \
            --junitxml=artifacts/junit.xml --durations=25

      - name: Upload artifacts (tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts
          if-no-files-found: ignore

  online_probes:
    name: Online Probes (optional, manual)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_online_probes == 'true' }}

    env:
      NO_NETWORK: "0"
      DISABLE_NETWORK: "0"
      NO_NETWORK_POLICY: "0"
      PROBES_ENABLED: "1"

      DRYRUN: "1"
      SAFE_MODE: "1"

      CHECK_ROUTER_JSON_ONLY: "1"
      CHECK_ROUTER_HARD_EXIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git EOL hygiene (deterministic checkouts)
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps (runtime + dev)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || true
          fi

      - name: Prepare artifacts dir
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: check_router (json-only, hard-exit) — informational
        run: |
          set -euo pipefail
          python -m scripts.check_router --json-only --total-timeout 25 | tee artifacts/check_router.json

      - name: Upload artifacts (online probes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-probes-artifacts
          path: artifacts
          if-no-files-found: ignore
