name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global env: safe posture everywhere, but we do NOT force NO_NETWORK globally,
# because preflight is intended to validate RPC/Jupiter/router connectivity.
env:
  SAFE_MODE: "1"
  DRYRUN: "1"
  CI: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: "UTC"
  # Ensure src-layout repos import reliably even without editable installs.
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Smoke (compile + hard no-network imports)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Hard no-network for this job only.
    env:
      NO_NETWORK: "1"
      DISABLE_NETWORK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          # Optional editable install if the repo is packaged
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

          python -c "import sys; print(sys.version)"

      - name: Compile all (syntax/import-time issues)
        run: |
          set -euo pipefail
          python -m compileall -q -f .

      - name: CI smoke (hard no-network spine imports)
        run: |
          set -euo pipefail
          python -m scripts.ci_smoke

      - name: Ruff (optional; non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          if command -v ruff >/dev/null 2>&1; then
            ruff check . || true
            ruff format --check . || true
          else
            echo "ruff not installed; skipping."
          fi

      - name: Mypy (optional; non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          if command -v mypy >/dev/null 2>&1; then
            mypy . || true
          else
            echo "mypy not installed; skipping."
          fi

  preflight:
    name: Preflight (deploy profile)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

      # Mirrors your proven local command exactly
      - name: Run preflight (json-only)
        run: |
          set -euo pipefail
          python -m scripts.preflight --json-only

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

      # Mirrors your proven local command exactly
      - name: Pytest (full suite)
        run: |
          set -euo pipefail
          python -m pytest -q

      # Mirrors your proven local command exactly (redundant but intentional)
      - name: Pytest (exclude integration/network)
        run: |
          set -euo pipefail
          python -m pytest -q -m "not integration and not network"
