name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (compile + no-network imports)
    runs-on: ubuntu-latest

    env:
      SAFE_MODE: "1"
      DRYRUN: "1"
      NO_NETWORK: "1"
      DISABLE_NETWORK: "1"
      CI: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

      - name: Compile all (syntax / import-time errors)
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .

      - name: CI smoke (hard no-network sanity)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_smoke.py

      - name: Ruff (optional; runs only if config exists)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || [ -f pyproject.toml ]; then
            ruff check .
            ruff format --check .
          else
            echo "ruff config not found; skipping lint."
          fi

      - name: Mypy (optional; runs only if config exists)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f mypy.ini ] || [ -f pyproject.toml ]; then
            mypy .
          else
            echo "mypy config not found; skipping type-check."
          fi

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: smoke

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      SAFE_MODE: "1"
      DRYRUN: "1"
      NO_NETWORK: "1"
      DISABLE_NETWORK: "1"
      CI: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

      - name: Run pytest (no network / no integration)
        shell: bash
        run: |
          set -euo pipefail
          pytest -q -m "not integration and not network"
