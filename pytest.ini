# pytest.ini — God-Tier Test Contract (Phase 0–7 LOCK-IN / PROD)
#
# Goals:
#   ✅ Deterministic discovery (tests/ only)
#   ✅ Strict markers + strict config (typos fail fast)
#   ✅ SAFE defaults (no integration/network/slow unless explicitly enabled)
#   ✅ CI-friendly output + readable failures
#
# IMPORTANT:
# - pytest will use THIS file if it exists.
# - Keep ALL pytest behavior here to avoid drift with pyproject.toml.
#
# Examples:
#   pytest
#   pytest -m smoke
#   pytest -m "unit and not slow"
#   pytest -m integration
#   pytest -m network
#   pytest -m slow

[pytest]
minversion = 7.0

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

norecursedirs =
    .git
    .github
    .cache
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .venv
    venv
    env
    build
    dist
    node_modules
    scripts
    tools
    deploy_tools
    data
    logs
    tmp
    __pycache__
    migrations

# Default posture: stable + offline + fast.
# NOTE: If CI passes a different "-m ...", that will override this selector.
addopts =
    -q
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --durations=25
    -m "not integration and not network and not slow"

# Enforce plugin presence (prevents ini keys silently being ignored).
required_plugins =
    pytest-asyncio

markers =
    unit: fast pure unit tests (default)
    smoke: minimal go/no-go wiring tests (default-safe)
    integration: requires external services (RPC/Redis/Postgres/HTTP); opt-in only
    network: hits real network (opt-in only)
    slow: long-running tests (opt-in only)

    contract: contract/shape tests (schemas, env contract, invariants)
    regression: prevents reintroducing past bugs
    perf: performance-related assertions (non-benchmark; avoid flakiness)

    db: requires database
    redis: requires redis
    rpc: requires solana RPC
    router: jupiter routing/quote/build/swap contract tests
    scanners: scanner emit/shape tests
    entry: entry pipeline tests
    exit: exit pipeline tests
    risk: risk_manager / guardrails tests
    storage: position store / persistence tests
    alerts: telegram/discord/notion alerting tests

xfail_strict = true

# Async testing (requires pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output + reporting
console_output_style = progress
junit_family = xunit2

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%dT%H:%M:%S

filterwarnings =
    ignore:.*distutils.*:DeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*'cgi' is deprecated.*:DeprecationWarning
    ignore:.*imp module is deprecated.*:DeprecationWarning
