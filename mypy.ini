# mypy.ini - God-Tier typing contract (CI-safe, Windows-safe, minimal day-1 noise)

[mypy]
python_version = 3.12

pretty = True
show_error_codes = True
show_column_numbers = True

ignore_missing_imports = True
follow_imports = skip

namespace_packages = True
explicit_package_bases = True

warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
warn_unused_ignores = False

cache_dir = .mypy_cache
incremental = True

# IMPORTANT: mypy splits this setting by COMMAS
files =
    utils_pkg/core_utils.py,
    utils_pkg/contracts.py,
    utils_pkg/db_dsn.py,
    utils_pkg/router.py,
    utils_pkg/feature_builder.py,
    utils_pkg/ai_entry_logic.py,
    utils_pkg/exit_engine.py,
    utils_pkg/auto_exit_worker/exit_engine.py,
    scripts/ci_smoke.py

# Keep exclude single-line (no configparser weirdness)
exclude = (?x)(^\.git[\\/]|^\.venv[\\/]|^venv[\\/]|^build[\\/]|^dist[\\/]|^node_modules[\\/]|^__pycache__[\\/]|^\.pytest_cache[\\/]|^\.ruff_cache[\\/]|^\.mypy_cache[\\/]|^data[\\/]|^exports[\\/]|^allocator[\\/]|^perps[\\/]|^daytrader[\\/]|^db[\\/]|^metrics[\\/])

[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

[mypy-scripts.ci_smoke]
ignore_errors = False
